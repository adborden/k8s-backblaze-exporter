---
name: Test

on: # yamllint disable-line rule:truthy
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python
        uses: actions/setup-python@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10

      - run: make lint

      - run: make test
